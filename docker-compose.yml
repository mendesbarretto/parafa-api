services:
  api:
    container_name: cnpj-parafa-api
    image: ${IMAGE_NAME:-cnpj-parafa-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-256m}
    mem_reservation: ${API_MEMORY_RESERVATION:-160m}
    cpus: ${API_CPU_LIMIT:-0.50}
    pids_limit: 64
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      # PostgreSQL está no host. Não use o IP público, que pode estar bloqueado pelo firewall.
      DB_HOST2: host.docker.internal
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      cnpj-internal:
        aliases:
          - cnpj-api
    ports:
      - "127.0.0.1:${HOST_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/up\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  cnpj-internal:
    external: true
    name: ${INTERNAL_NETWORK:-cnpj-internal}
