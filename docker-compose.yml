services:
  api:
    container_name: cnpj-parafa-api
    image: ${IMAGE_NAME:-cnpj-parafa-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-256m}
    mem_reservation: ${API_MEMORY_RESERVATION:-160m}
    cpus: ${API_CPU_LIMIT:-0.50}
    pids_limit: 64
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      cnpj-internal:
        aliases:
          - cnpj-php

  web:
    container_name: cnpj-parafa-api-web
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-48m}
    mem_reservation: ${WEB_MEMORY_RESERVATION:-24m}
    cpus: ${WEB_CPU_LIMIT:-0.20}
    pids_limit: 32
    depends_on:
      - api
    ports:
      - "127.0.0.1:${HOST_PORT:-8082}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/public:ro
    networks:
      cnpj-internal:
        aliases:
          - cnpj-api

networks:
  cnpj-internal:
    external: true
    name: ${INTERNAL_NETWORK:-cnpj-internal}
